[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-pipeline"
version = "1.0.0"
description = "Multimodal retrieval and structured parsing toolkit for trading cards."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9,<1",
  "Pillow>=10,<12",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
retrieval = [
  "pymilvus>=2.4,<3",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "transformers>=4.40,<5",
  "timm>=1.0,<2",
  "insightface>=0.7,<1",
  "onnxruntime>=1.17,<2",
  "open-clip-torch>=2.24,<4",
  "huggingface-hub>=0.23,<2",
  "opencv-python-headless>=4.8,<5",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
]
ranking = [
  "lightgbm>=4.3,<5",
  "pandas>=2,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.3,<2",
  "opencv-python-headless>=4.8,<5",
]
parsing = [
  "chromadb>=0.5,<2",
  "sentence-transformers>=3,<6",
  "ollama>=0.3,<1",
  "pandas>=2,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2,<3",
  "streamlit>=1.36,<2",
]
ocr-training = [
  "torch>=2.2,<3",
  "transformers>=4.57,<5",
  "peft>=0.13,<1",
  "accelerate>=1,<2",
  "huggingface-hub>=0.23,<2",
]
preprocessing = [
  "ultralytics>=8.2,<9",
  "opencv-python-headless>=4.8,<5",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
card-pipeline-api = "router.api:run"
card-pipeline-create-collection = "service.create_collection:main"
card-pipeline-index-images = "service.index_images:main"
card-pipeline-chroma-viewer = "knowledge.chroma_viewer:main"
card-pipeline-doctor = "router.system:run_doctor"
card-pipeline-train-ranker = "scripts.train_ranker:main"
card-pipeline-download-ranker = "scripts.download_ranker_model:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ocr_parsing/prompts.py" = ["E501"]
